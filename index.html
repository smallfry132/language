<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>HSK 1 Trainer</title>
  <meta name="description" content="Study the 150 HSK 1 Chinese words with tiles, flashcards, quizzes and more. Optimized for Mac and iPhone.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151417" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HSK 1">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-glyph">中</span>
        <div>
          <div class="brand-title">HSK 1</div>
          <div class="brand-sub" data-i18n="brandSub">Trainer</div>
        </div>
      </div>
      <nav class="nav" id="nav-desktop"></nav>
      <div class="sidebar-foot">
        <button class="lang-toggle" id="lang-toggle-desktop" type="button" aria-label="Language"></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="topbar-back" id="topbar-back" type="button" aria-label="Back" hidden>‹</button>
        <h1 class="topbar-title" id="topbar-title">HSK 1</h1>
        <button class="lang-toggle" id="lang-toggle-mobile" type="button" aria-label="Language"></button>
      </header>

      <main id="view" class="view" aria-live="polite"></main>

      <nav class="tabbar" id="nav-mobile"></nav>
    </div>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
